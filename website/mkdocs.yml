site_name: Quxlang.dev
site_description: Comprehensive language documentation for Quxlang.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: assets/quxlang-q-green.svg
  favicon: assets/quxlang-q-green.svg
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search

extra:
  generator: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /philosophy/stability.md

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - https://keepandroidopen.org/banner.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

