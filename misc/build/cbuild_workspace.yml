sources:
    benchmark:
        git:
            repository: https://github.com/rpnx/google-benchmark.git
            revision: b514eee1c23e3322693a6d98eee00f93652073d6
            branch: main
    compress:
        git:
            repository: https://gitlab.com/rpnx/compress.git
    cortado:
        git:
            repository: https://gitlab.com/rpnx/cortado.git
    datastructures:
        git:
            repository: https://gitlab.com/rpnx/datastructures.git
            revision: 849e84175e1329d94ef9c93e9a9a3464ca44d25e
    googletest:
        git:
            repository: https://github.com/rpnx/googletest.git
            revision: 0ccfdbb8ce09abf507836e310ccf4562a92223cb
    llvm:
        git:
            repository: https://github.com/llvm/llvm-project.git
            revision: llvmorg-22.1.8
    metalib:
        git:
            repository: https://gitlab.com/rpnx/metalib.git
    mimalloc:
        git:
            repository: https://github.com/microsoft/mimalloc.git
            revision: c7c242e30d77a7bf2826969ce93adb61b22292c7
    querygraph:
        git:
            repository: https://gitlab.com/rpnx/querygraph.git
            revision: cf6c3590c096b6a043cb32b41aa48c0c8adb8b97
    quxlang:
        local: ../../quxlang
    serialization:
        git:
            repository: https://gitlab.com/rpnx/serialization.git
            revision: 54bb86101b3801330bb21253904b9e2529d0995a
    yaml-cpp:
        git:
            repository: https://github.com/rpnx/yaml-cpp.git
            revision: d1f45aa4d71f308a37024a23a2b91413b1951d38
targets:
    benchmark:
        source: benchmark
        depends: []
        project_type: CMake
        cmake_options:
            BENCHMARK_ENABLE_TESTING: "Off"
    compress:
        source: compress
        depends:
            - googletest
        project_type: CMake
        cmake_package_name: RPNXCompress
    cortado:
        source: cortado
        depends:
            - googletest
            - compress
            - metalib
            - datastructures
        project_type: CMake
        cmake_package_name: RPNXCortado
    datastructures:
        source: datastructures
        depends:
            - googletest
            - benchmark
        project_type: CMake
        cmake_package_name: RPNXDataStructures
    googletest:
        source: googletest
        depends: []
        project_type: CMake
        cmake_package_name: GTest
        staged: true
    llvm:
        source: llvm/llvm
        depends: []
        project_type: CMake
        cmake_package_name: LLVM
        staged: true
        cmake_options:
            LLVM_ADDITIONAL_BUILD_TYPES: DebugASAN;DebugTSAN;ReleaseLTO;RelWithDebInfoLTO
            LLVM_ENABLE_EH: "on"
            LLVM_ENABLE_RTTI: "on"
        cxx_standard: "17"
    metalib:
        source: metalib
        depends: []
        project_type: CMake
        cmake_package_name: RPNXMetalib
        cxx_standard: "23"
    mimalloc:
        source: mimalloc
        depends: []
        project_type: CMake
        cmake_package_name: mimalloc
        staged: true
        cmake_options:
            MI_BUILD_OBJECT: "Off"
            MI_BUILD_SHARED: "Off"
            MI_BUILD_STATIC: "On"
            MI_BUILD_TESTS: "Off"
            MI_OVERRIDE: "Off"
    querygraph:
        source: querygraph
        depends:
            - datastructures
            - metalib
            - serialization
        project_type: CMake
        cmake_package_name: RPNXQueryGraph
    quxlang:
        source: quxlang
        depends:
            - benchmark
            - googletest
            - llvm
            - yaml-cpp
            - datastructures
            - metalib
            - mimalloc
            - serialization
            - querygraph
            - cortado
        project_type: CMake
    serialization:
        source: serialization
        depends:
            - metalib
            - googletest
        project_type: CMake
        cmake_package_name: RPNXSerialization
    yaml-cpp:
        source: yaml-cpp
        depends: []
        project_type: CMake
cxx_version: "23"
configurations:
    - Debug
    - Release
    - DebugASAN
    - DebugTSAN
